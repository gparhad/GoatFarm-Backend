# ===============================================================
# Application
# ===============================================================
spring.application.name=AnimalDetective
server.port=8080

# ===============================================================
# Database (PostgreSQL). No defaults on purpose: credentials come from the environment only.
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>/<db>?sslmode=require
# ===============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-cool-star-azdnk42y-pooler.c-3.ap-southeast-1.aws.neon.tech/AnimalDetective?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_HO21CwdVoSpZ}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (kept from the original: helpful for serverless Postgres wake-up)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.connection-timeout=30000

# ===============================================================
# JPA / Hibernate
# ===============================================================
# "update" is what the project has always used. Prefer "validate" once schema changes are managed by migrations.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
# Entities are mapped to DTOs inside service transactions; no lazy loading happens in the web layer.
spring.jpa.open-in-view=false
# Loads lazy collections / associations in batches instead of one query per row.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ===============================================================
# Security
# ===============================================================
# Base64-encoded key, >= 256 bits.   openssl rand -base64 48
jwt.secret=qXv9Z8tK3uM5yP1wA4dF7gJ2hL6kR9sV0bN3cE5xT8yU1iO4pA7sD0fG2jH5kL8=
# Token lifetime (default 7 days, the value the code effectively used before)
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
# Comma separated origin patterns, e.g. https://app.example.com,capacitor://localhost
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGINS:*}

# ===============================================================
# Time. Empty = JVM default zone. On a UTC host set e.g. Asia/Kolkata so "today" matches the farm's calendar.
# ===============================================================
app.time-zone=${APP_TIME_ZONE:}

# ===============================================================
# Logging (quiet by default; verbose SQL/JSON logging lives in the "dev" profile only)
# ===============================================================
logging.level.root=INFO
logging.level.com.goatfarm=INFO

